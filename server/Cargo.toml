[package]
name = "remex-server"
version = "0.1.0"
authors = ["Zion Koyl<hiszd1@gmail.com>"]
edition = "2021"
default-run = "remex-server"

[dependencies]
remex-core = { path = "../core" }
heapless = "0.9.2"
chrono = { version = "0.4.38", features = ["serde"] }
tokio = { version = "1.38.1", features = ["full"] }
tracing = { version = "0.1.40", features = ["async-await"] }
tracing-subscriber = { version = "0.3.18", features = ["chrono"] }
actix = "0.13"
actix-codec = "0.5.2"
actix-rt = "2.10.0"
actix-web = "4"
byteorder = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10.3", features = ["heapless"] }
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
tokio-util = "0.7.4"
futures-util = "0.3.31"
anyhow = "1.0.97"
# clap = { version = "4.5.9", features = ["derive"] }
rand = "0.10"
derive_more = { version = "2", features = ["full"] }
dotenvy = "0.15"
futures = "0.3.31"

# Utoipa core and Actix integration
utoipa = { version = "5", features = ["chrono", "actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
actix-cors = "0.7.1"
