[package]
name = "remex_core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
heapless = "0.8.0"
tokio = { version = "1.38.1", features = ["full"] }
tracing = { version = "0.1.40", features = ["async-await"] }
tracing-subscriber = { version = "0.3.18", features = ["chrono"] }
sqlx = { version = "0.8.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "derive", "uuid"] }
actix = "0.13"
actix-codec = "0.5"
actix-files = "0.6"
actix-web = "4.9"
actix-web-actors = "4.1"
actix-ws = "0.3"
byteorder = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.6.1"
aes-gcm = { version = "0.10.3", features = ["heapless"] }
