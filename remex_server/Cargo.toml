[package]
name = "remex_server"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
heapless = "0.8.0"
remex_core = { path = "../remex_core" }
clap = { version = "4.5.9", features = ["derive"] }
tracing = { version = "0.1.40", features = ["async-await"] }
tracing-subscriber = { version = "0.3.18", features = ["chrono"] }

byteorder = "1.2"
env_logger = "0.11"
futures-util = { version = "0.3.17", default-features = false, features = ["std"] }
log = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.24.2", features = ["sync", "io-util"] }
tokio-util = "0.7.4"
tokio-stream = "0.1.1"

actix = "0.13"
actix-codec = "0.5"
actix-files = "0.6"
actix-web = "4.9"
actix-web-actors = "4.1"
actix-ws = "0.3"

chrono = { version = "0.4.38", features = ["serde"] }
derive_more = {version = "2", features = ["full"]}
dotenvy = "0.15"
eyre = { version = "0.6", default-features = false, features = ["auto-install", "track-caller"] }
color-eyre = "0.6"
openssl = { version = "0.10.60", features = ["v110"] }
parking_lot = "0.12"
pin-project-lite = "0.2"
redis = { version = "0.27" }
reqwest = { version = "0.12", features = ["json", "stream"] }
rustls = "0.23"
rustls-pemfile = "2"
time = "0.3"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "migrate", "chrono", "derive", "uuid", "postgres"] }
tokio-rustls = "0.26.2"
webpki-roots = "0.26.8"
argh = "0.1.13"
blake3 = "1.6.1"
anyhow = "1.0.97"
actix-rt = "2.10.0"
