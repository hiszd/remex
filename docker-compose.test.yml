# docker-compose.test.yml — SurrealDB instance for integration tests
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   cargo test -p remex-endpoint --test auth
#   docker compose -f docker-compose.test.yml down -v

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: remex-test-surrealdb
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root
    environment:
      - SURREAL_INSECURE_FORWARD_ACCESS_ERRORS=true
    healthcheck:
      test: ["CMD", "/surreal", "is", "ready"]
      interval: 2s
      timeout: 5s
      retries: 10
