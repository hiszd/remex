[package]
name = "remex-endpoint"
version = "0.1.0"
authors = ["Zion Koyl<hiszd1@gmail.com>"]
edition = "2021"

[dependencies]
remex-core = { path = "../core" }
heapless = "0.9.2"
chrono = { version = "0.4.38", features = ["serde"] }
tokio = { version = "1.38.1", features = ["full"] }
tracing = { version = "0.1.40", features = ["async-await"] }
tracing-subscriber = { version = "0.3.18", features = ["chrono"] }
actix = "0.13"
actix-codec = "0.5.2"
actix-files = "0.6"
actix-web = "4.9"
actix-web-actors = "4.1"
actix-ws = "0.3"
actix-rt = "2.10.0"
byteorder = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10.3", features = ["heapless"] }
gethostname = "1.1.0"
machine-uid = "0.5.2"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.4"
futures-util = "0.3.31"
anyhow = "1.0.97"
clap = { version = "4.5.9", features = ["derive", "env"] }
rand = "0.9"
derive_more = { version = "2", features = ["full"] }
dotenvy = "0.15"
futures = "0.3.31"
sha2 = "0.10.9"
